# Keep secrets.yaml beside this device YAML.
# From the repo root: esphome compile examples/esphome/desk.yaml
# Example pin choices only: map these to the ESP32 board actually used.
substitutions:
  device_name: t150-desk-control
  # Relative to the ESPHome data directory; use an absolute path for exact placement.
  build_directory: .esphome/build/t150-desk-control
  uart_tx_pin: GPIO17
  uart_rx_pin: GPIO16

esphome:
  name: ${device_name}
  build_path: ${build_directory}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - <<:
      source:
        type: local
        path: ../../components  # Relative to the main YAML; expects examples/esphome/.
    # For Device Builder or copied YAML, uncomment GitHub below instead.
    # If keeping a local source after moving this file, update path above.
    # source: github://0xA2C3B1F4/t150-desk-control@main
    components: [desk_uart]

logger:
  baud_rate: 0  # Disable UART logging on the desk connection.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s  # Keep local control running during Wi-Fi outages.

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3  # Native entity groups; assets remain local.
  local: true  # Serve the interface from the ESP32, including JavaScript.
  log: false
  sorting_groups:
    - id: desk_group_control
      name: Desk control
      sorting_weight: 10
    - id: desk_group_diagnostics
      name: Diagnostics
      sorting_weight: 60
  auth:
    username: !secret web_username
    password: !secret web_password

uart:
  id: desk_serial
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

desk_uart:
  id: desk
  uart_id: desk_serial
  display_unit: cm  # Or in. Independent of the physical panel's units.
  controller_model:
    name: Controller model
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 30
  controller_manufacturer:
    name: Controller manufacturer
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 40
  controller_identifiers:
    name: Controller identifiers
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 50
  controller_date:
    name: Controller date
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 60
  height:
    name: Desk height
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 10
  connected:
    name: Desk UART connected
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 10
  # Optional diagnostics for rejected commands and temporary Stop blocking.
  # control_status:
  #   name: Desk control status
  # command_result:
  #   name: Desk last command result
  # stop_locked:
  #   name: Desk stop pending
  # Default configuration sends only telemetry scheduling commands.
  # Explicit opt-in below exposes motion through already-stored presets.
  # experimental_preset_buttons: true
  # preset_1:
  #   name: Desk preset 1
  # preset_2:
  #   name: Desk preset 2
  # preset_3:
  #   name: Desk preset 3

  # Optional Configuration field, independent of recall-button opt-in.
  # preset_1_height:
  #   name: Preset 1 height
  #   mode: box
  # Also available: preset_2_height and preset_3_height.

  # Optional direct brake. Blocks recalls until ACK, settling and cleanup.
  # stop:
  #   name: Desk stop

  # Optional T-key timer workflow. Leave local keys untouched while pending.
  # experimental_timer_buttons: true
  # timer_30min:
  #   name: Desk timer 30 min
  # timer_60min:
  #   name: Desk timer 60 min
  # timer_90min:
  #   name: Desk timer 90 min
  # timer_120min:
  #   name: Desk timer 120 min
  # cancel_timer:
  #   name: Cancel desk timer
  # timer_command_pending:
  #   name: Desk timer command pending

  # Optional raw protection settings. Reads current values; no startup writes.
  # Change only while the desk is stationary. Downward base also affects homing.
  # upward_load_limit:
  #   name: Desk upward load limit (raw)
  #   mode: box
  # downward_load_limit:
  #   name: Desk downward base - affects calibration (raw)
  #   mode: box
  # restore_upward_load_limit:
  #   name: Restore initial upward limit
  # restore_downward_load_limit:
  #   name: Restore initial downward base

# Local load-detector automation: `- desk_uart.stop: desk`
# Or call id(desk).stop() in a main-loop lambda. No detector is configured here.
# Acknowledged Stops clear automatically after settling and preset cleanup.
# A new explicit Stop can be sent after the two-second duplicate suppression window.

# Recovery-only controls are also available without enabling movement:
# desk_uart:
#   restore_preset_3:
#     name: Restore interrupted preset
#   accept_current_preset_3:
#     name: Accept current preset 3 and discard backup
