web_server:
  sorting_groups:
    - id: desk_group_control
      name: Desk control
      sorting_weight: 10
    - id: desk_group_presets
      name: Presets
      sorting_weight: 20
    - id: desk_group_timer
      name: Timer
      sorting_weight: 30
    - id: desk_group_load
      name: Load settings
      sorting_weight: 40
    - id: desk_group_recovery
      name: Recovery
      sorting_weight: 50
    - id: desk_group_diagnostics
      name: Diagnostics
      sorting_weight: 60

uart:
  id: desk_serial
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

desk_uart:
  id: desk
  uart_id: desk_serial
  display_unit: cm # Or in. min_height/max_height below always use centimetres.
  controller_model:
    name: Controller model
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 30
  controller_manufacturer:
    name: Controller manufacturer
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 40
  controller_identifiers:
    name: Controller identifiers
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 50
  controller_date:
    name: Controller date
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 60
  height:
    name: Height
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 10
  connected:
    name: UART connected
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 10
  control_status:
    name: Control status
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 40
  command_result:
    name: Last command result
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 20
  stop_locked:
    name: Stop pending
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 10
  # Use auto for automatic stock/DT02 selection; see docs/esphome.md.
  experimental_preset_buttons: true
  experimental_target_height: true
  target_height_mode: preset
  keep_awake: auto
  target_height_backend:
    name: Height control method
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 25
  min_height: 73.0
  max_height: 118.0
  target_height:
    name: Target height
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 20
    mode: slider
  # Jogging uses the physical panel; no remote Up/Down entities.
  restore_preset_3:
    name: Restore interrupted preset
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 30
  accept_current_preset_3:
    name: Accept current preset 3 and discard backup
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 40
  preset_restore_pending:
    name: Preset restoration pending
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 20
  preset_1_height:
    name: Preset 1 height
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 20
    mode: box
  preset_2_height:
    name: Preset 2 height
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 40
    mode: box
  preset_3_height:
    name: Preset 3 height
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 60
    mode: box
  preset_1:
    name: Preset 1
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 10
  preset_2:
    name: Preset 2
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 30
  preset_3:
    name: Preset 3
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 50
  stop:
    name: Stop
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 30
  experimental_timer_buttons: true
  timer_30min:
    name: Timer 30 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 10
  timer_60min:
    name: Timer 60 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 20
  timer_90min:
    name: Timer 90 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 30
  timer_120min:
    name: Timer 120 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 40
  cancel_timer:
    name: Cancel timer
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 50
  timer_command_pending:
    name: Timer command pending
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 60
  upward_load_limit:
    name: Upward load limit (raw)
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 10
    mode: box
  downward_load_limit:
    name: Downward base - affects calibration (raw)
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 20
    mode: box
  restore_upward_load_limit:
    name: Restore initial upward limit
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 30
  restore_downward_load_limit:
    name: Restore initial downward base
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 40
