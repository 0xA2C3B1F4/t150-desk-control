# Optional CL01 controls for the supplied desk examples (id: desk).
# Locked physical buttons cannot stop remote movement. See docs/child-lock.md.
# Keep this package enabled in the normal build after installing CL01.
desk_uart:
  id: desk
  child_lock:
    name: Panel lock
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 30
  child_lock_available:
    name: Panel lock available
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 27
  child_lock_status:
    name: Panel lock status
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 26
