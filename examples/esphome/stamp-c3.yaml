# Keep secrets.yaml beside this device YAML.
# For a standalone Device Builder config, use github/stamp-c3.yaml.
# Copying this local example also requires packages/stamp-c3-controls.yaml.
# From the repo root: esphome compile examples/esphome/stamp-c3.yaml
# M5Stack Stamp-C3 (C056-B): desk UART on exposed G4/G5.
# Cross TX/RX: G4 -> desk RX, G5 <- desk TX; common GND.
# Power the Stamp through its own USB-C connection; leave 5V/3V3 unconnected.
# These are 3.3V logic signals, not standard USB D+/D-.
# Reference: https://docs.m5stack.com/en/core/Stamp-C3
# Optional CL01 panel lock and RS01 reset/speed controls.
# Add them under packages below.
#   panel_lock: !include packages/panel-lock.yaml
#   reset_speed: !include packages/reset-speed.yaml
substitutions:
  device_name: t150-desk-control-stamp-c3
  # Relative to the ESPHome data directory; use an absolute path for exact placement.
  build_directory: .esphome/build/t150-desk-control-stamp-c3
  uart_tx_pin: GPIO4
  uart_rx_pin: GPIO5

packages:
  desk_controls: !include packages/stamp-c3-controls.yaml

esphome:
  name: ${device_name}
  build_path: ${build_directory}

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - <<:
      source:
        type: local
        path: ../../components # Relative to the main YAML; expects examples/esphome/.
    # For copied YAML, keep the included package and uncomment GitHub below.
    # If keeping a local source after moving this file, update path above.
    # source: github://0xA2C3B1F4/t150-desk-control@main
    components: [desk_uart]

logger:
  hardware_uart: UART0 # Stamp USB-serial, G21/G20. Desk uses UART1 on G4/G5.
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s # Keep local control running during Wi-Fi outages.

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3 # Native entity groups; assets remain local.
  local: true # Serve the interface from the ESP32, including JavaScript.
  log: false
  auth:
    username: !secret web_username
    password: !secret web_password
