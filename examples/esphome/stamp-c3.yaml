# Keep secrets.yaml beside this device YAML.
# From the repo root: esphome compile examples/esphome/stamp-c3.yaml
# M5Stack Stamp-C3 (C056-B): desk UART on exposed G4/G5.
# Cross TX/RX: G4 -> desk RX, G5 <- desk TX; common GND.
# Power the Stamp through its own USB-C connection; leave 5V/3V3 unconnected.
# These are 3.3V logic signals, not standard USB D+/D-.
# Reference: https://docs.m5stack.com/en/core/Stamp-C3
# Optional CL01 panel lock, including its status and availability.
# packages:
#   panel_lock: !include packages/child-lock.yaml
substitutions:
  device_name: t150-desk-control-stamp-c3
  # Relative to the ESPHome data directory; use an absolute path for exact placement.
  build_directory: .esphome/build/t150-desk-control-stamp-c3
  uart_tx_pin: GPIO4
  uart_rx_pin: GPIO5

esphome:
  name: ${device_name}
  build_path: ${build_directory}

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - <<:
      source:
        type: local
        path: ../../components  # Relative to the main YAML; expects examples/esphome/.
    # For Device Builder or copied YAML, uncomment GitHub below instead.
    # If keeping a local source after moving this file, update path above.
    # source: github://0xA2C3B1F4/t150-desk-control@main
    components: [desk_uart]

logger:
  hardware_uart: UART0  # Stamp USB-serial, G21/G20. Desk uses UART1 on G4/G5.
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s  # Keep local control running during Wi-Fi outages.

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3  # Native entity groups; assets remain local.
  local: true  # Serve the interface from the ESP32, including JavaScript.
  log: false
  sorting_groups:
    - id: desk_group_control
      name: Desk control
      sorting_weight: 10
    - id: desk_group_presets
      name: Presets
      sorting_weight: 20
    - id: desk_group_timer
      name: Timer
      sorting_weight: 30
    - id: desk_group_load
      name: Load settings
      sorting_weight: 40
    - id: desk_group_recovery
      name: Recovery
      sorting_weight: 50
    - id: desk_group_diagnostics
      name: Diagnostics
      sorting_weight: 60
  auth:
    username: !secret web_username
    password: !secret web_password

uart:
  id: desk_serial
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

desk_uart:
  id: desk
  uart_id: desk_serial
  display_unit: cm  # Or in. min_height/max_height below always use centimetres.
  controller_model:
    name: Controller model
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 30
  controller_manufacturer:
    name: Controller manufacturer
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 40
  controller_identifiers:
    name: Controller identifiers
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 50
  controller_date:
    name: Controller date
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 60
  height:
    name: Height
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 10
  connected:
    name: UART connected
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 10
  control_status:
    name: Control status
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 40
  command_result:
    name: Last command result
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 20
  stop_locked:
    name: Stop pending
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 10
  # Use auto for automatic stock/DT02 selection; see docs/esphome.md.
  experimental_preset_buttons: true
  experimental_target_height: true
  target_height_mode: preset
  keep_awake: auto
  target_height_backend:
    name: Target backend
    web_server:
      sorting_group_id: desk_group_diagnostics
      sorting_weight: 25
  min_height: 73.0
  max_height: 118.0
  target_height:
    name: Target height
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 20
    mode: slider
  # Jogging uses the physical panel; no remote Up/Down entities.
  restore_preset_3:
    name: Restore interrupted preset
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 30
  accept_current_preset_3:
    name: Accept current preset 3 and discard backup
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 40
  preset_restore_pending:
    name: Preset restoration pending
    web_server:
      sorting_group_id: desk_group_recovery
      sorting_weight: 20
  preset_1_height:
    name: Preset 1 height
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 20
    mode: box
  preset_2_height:
    name: Preset 2 height
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 40
    mode: box
  preset_3_height:
    name: Preset 3 height
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 60
    mode: box
  preset_1:
    name: Preset 1
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 10
  preset_2:
    name: Preset 2
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 30
  preset_3:
    name: Preset 3
    web_server:
      sorting_group_id: desk_group_presets
      sorting_weight: 50
  stop:
    name: Stop
    web_server:
      sorting_group_id: desk_group_control
      sorting_weight: 30
  experimental_timer_buttons: true
  timer_30min:
    name: Timer 30 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 10
  timer_60min:
    name: Timer 60 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 20
  timer_90min:
    name: Timer 90 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 30
  timer_120min:
    name: Timer 120 min
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 40
  cancel_timer:
    name: Cancel timer
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 50
  timer_command_pending:
    name: Timer command pending
    web_server:
      sorting_group_id: desk_group_timer
      sorting_weight: 60
  upward_load_limit:
    name: Upward load limit (raw)
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 10
    mode: box
  downward_load_limit:
    name: Downward base - affects calibration (raw)
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 20
    mode: box
  restore_upward_load_limit:
    name: Restore initial upward limit
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 30
  restore_downward_load_limit:
    name: Restore initial downward base
    web_server:
      sorting_group_id: desk_group_load
      sorting_weight: 40
