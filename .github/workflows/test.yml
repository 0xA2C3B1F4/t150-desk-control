name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full-suite:
        description: Run all checks when called by another workflow
        type: boolean
        default: true
      source-ref:
        type: string
        default: ""
      external-ref:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.full-suite && inputs.source-ref == '' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Configure temporary directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-ci.txt
      - name: Check CI selection and documentation
        run: |
          python -m unittest discover -s tests/ci -v
          python tools/check_docs.py
      - id: select
        name: Select checks for the complete change
        env:
          CI_FULL_SUITE: ${{ inputs.full-suite }}
          CI_SOURCE_REF: ${{ inputs.source-ref }}
        run: python tools/ci.py select

  style:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure temporary directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/desk-style/pip-cache" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$RUNNER_TEMP/desk-style/ruff-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-style.txt
      - name: Check Python formatting and lint
        run: |
          ruff format --check .
          ruff check .

  native:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Firmware UI state transitions
        if: matrix.build_type == 'Debug'
        run: node tests/esphome/firmware_ui_test.cjs
      - name: Offline child-lock builder and protocol
        if: matrix.build_type == 'Debug'
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/test_child_lock_builder.py
      - name: Install hash-pinned LLVM for patch reproduction
        if: matrix.build_type == 'Debug'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 tools/install_ci_llvm.py
      - name: Check C++ formatting and formatter boundaries
        if: matrix.build_type == 'Debug'
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests/style -v
          python3 tools/format_cpp.py --check
      - name: Reproduce embedded firmware patches
        if: matrix.build_type == 'Debug'
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/verify_dt02_assembly.py
          python3 tools/embed_child_lock_patch.py --check
          python3 tools/generate_reset_speed_core.py --clang clang --check
          python3 tools/embed_reset_speed_patch.py --check
      - name: C++11 ${{ matrix.build_type }} with ASan and UBSan
        run: |
          cmake -S . -B "$RUNNER_TEMP/native" -DDESK_SANITIZERS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build "$RUNNER_TEMP/native" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/native" --output-on-failure
  esphome:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.test == 'component_layout' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        test: [existing_device_config, source_metadata_integration, component_packaging, component_layout, config_validation, identity_integration, firmware_export_config, firmware_export_integration, firmware_export_lifecycle, firmware_update_lifecycle, firmware_update_config, firmware_profile_integration, integration, stop_integration, load_limits_integration, load_raw_integration, target_integration, retarget_integration, retarget_phase_integration, auto_target_integration, child_lock_integration, reset_speed_integration, direct_target_integration, direct_target_review_integration, preset_settings_integration, timer_integration, keep_awake_integration, preset_persistence_integration, profile_journal_integration, display_units_integration]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure temporary directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Install lifecycle host-test dependencies
        if: matrix.test == 'firmware_export_lifecycle' || matrix.test == 'firmware_update_lifecycle'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Validate adapter against a simulated UART peer
        run: |
          extra_args=()
          if [[ "${{ matrix.test }}" == "firmware_export_config" ]]; then
            extra_args+=(--compile)
          fi
          python "tests/esphome/${{ matrix.test }}.py" --work-dir "$TMPDIR/desk-test/run" "${extra_args[@]}"
          if [[ "${{ matrix.test }}" == "reset_speed_integration" ]]; then
            python tests/esphome/reset_speed_integration.py --work-dir "$TMPDIR/desk-test/concise" --concise-ui --only resume paused_idle
          fi
      - name: Preserve test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-${{ matrix.test }}
          path: |
            ${{ runner.temp }}/desk-test/run/**/*.log
            ${{ runner.temp }}/desk-test/run/**/*.json
            ${{ runner.temp }}/desk-test/run/host.yaml
            ${{ runner.temp }}/desk-test/concise/**/*.log
            ${{ runner.temp }}/desk-test/concise/**/*.json
            ${{ runner.temp }}/desk-test/concise/host.yaml
          if-no-files-found: ignore
          retention-days: 7

  github-example:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [stamp-c3, esp32, desk, stamp-c3-firmware-export, stamp-c3-firmware-update]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure temporary directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Build example from the checked-out GitHub revision
        run: python tests/esphome/github_example_build.py --example "${{ matrix.example }}" --work-dir "$TMPDIR/desk-example/run" --ref "${{ inputs.external-ref || inputs.source-ref || github.sha }}" --expected-commit "${{ inputs.source-ref || github.sha }}"
      - name: Preserve example diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-github-example-${{ matrix.example }}
          path: |
            ${{ runner.temp }}/desk-example/run/*.log
            ${{ runner.temp }}/desk-example/run/summary.json
          if-no-files-found: ignore
          retention-days: 7

  release-checks:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure temporary directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: python -m unittest discover -s tests/release -v
      - run: python tools/check_firmware_catalog.py

  release-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure temporary directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/esphome/release_examples.py --work-dir "$TMPDIR/desk-release-examples/run" --ref "${{ inputs.external-ref || inputs.source-ref || github.sha }}" --expected-commit "${{ inputs.source-ref || github.sha }}"
      - name: Preserve release example diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: diagnostics-release-examples
          path: |
            ${{ runner.temp }}/desk-release-examples/run/**/*.log
            ${{ runner.temp }}/desk-release-examples/run/summary.json
          if-no-files-found: ignore
          retention-days: 7

  ci-result:
    if: ${{ always() }}
    needs: [changes, style, native, esphome, github-example, release-checks, release-examples]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci.py result
